name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish explicitly
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify the requested release tag
        shell: bash
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Install Linux Rollup native package
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Check
        run: npm run check

      - name: Test composer-layout
        run: npm run test --workspace composer-layout

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --workspace composer-layout --access public
